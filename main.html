<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form method="post" action="/submit">
        <label for="name">Name</label>
        <input type="text" id="name" required><br>

        <label for="email">Email</label>
        <input type="email" id="email" required><br>

        <label for="gender">Gender</label>
        <input type="radio" id="gender_m" name="gender" value="male" required> Male
        <input type="radio" id="gender_f" name="gender" value="female" required> Female<br>

        <label for="cars">Car Brands</label>
        <select id="cars" required>
            <option value="" disabled selected>Select your brand</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedesz">Mercedesz</option>
        </select><br>

        <label for="carage">Car Age</label>
        <input type="number" id="carage" required><br>

        <label for="dop">DOP</label>
        <input type="date" id="dop" required><br>

        <label for="password">Password</label>
        <input type="password" id="password" required><br>

        <button type="submit">Submit</button>
    </form>
	<!-- the entire body must be written by the student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
